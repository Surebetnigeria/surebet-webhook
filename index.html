<!DOCTYPE html>
<html>
<head>
  <title>SureBet Nigeria Ltd - Wallet System</title>
</head>

<body>

<h2>🎰 SureBet Nigeria Ltd Wallet</h2>

<!-- LOGIN SECTION -->
<div id="loginBox">
  <h3>Login</h3>
  <input type="text" id="username" placeholder="Username"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

  <h3>Welcome, <span id="userDisplay"></span></h3>

  <h3>💰 Wallet Balance: ₦<span id="balance">0</span></h3>

  <hr>

  <!-- DEPOSIT -->
  <h3>Deposit Funds</h3>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="number" id="amount" placeholder="Enter amount (₦)"><br><br>
  <button onclick="payWithPaystack()">Deposit Now</button>

  <hr>

  <!-- HISTORY -->
  <h3>Transaction History</h3>
  <ul id="history"></ul>

  <br>
  <button onclick="logout()">Logout</button>
</div>

<script src="https://js.paystack.co/v1/inline.js"></script>

<script>

let balance = 0;
let transactions = [];

/* LOGIN */
function login(){
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if(user === "" || pass === ""){
    alert("Enter login details");
    return;
  }

  localStorage.setItem("user", user);

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  document.getElementById("userDisplay").innerText = user;

  loadData();
}

/* LOAD SAVED DATA */
function loadData(){
  let savedBalance = localStorage.getItem("balance");
  let savedHistory = localStorage.getItem("history");

  if(savedBalance){
    balance = parseFloat(savedBalance);
  }

  if(savedHistory){
    transactions = JSON.parse(savedHistory);
  }

  updateUI();
}

/* UPDATE SCREEN */
function updateUI(){
  document.getElementById("balance").innerText = balance;

  let list = document.getElementById("history");
  list.innerHTML = "";

  transactions.forEach(tx => {
    let li = document.createElement("li");
    li.innerText = tx;
    list.appendChild(li);
  });
}

/* PAYSTACK PAYMENT */
function payWithPaystack(){

  let email = document.getElementById("email").value;
  let amount = document.getElementById("amount").value;

  if(email === "" || amount === ""){
    alert("Fill all fields");
    return;
  }

  let handler = PaystackPop.setup({
    key: "YOUR_PUBLIC_KEY_HERE", // 🔴 replace this
    email: email,
    amount: amount * 100,
    currency: "NGN",

    ref: "SB-" + Math.floor(Math.random() * 1000000000),

    callback: function(response){

      let amt = parseFloat(amount);

      // update wallet
      balance += amt;
      localStorage.setItem("balance", balance);

      // save transaction
      let record = "Deposit ₦" + amt + " | Ref: " + response.reference;
      transactions.push(record);

      localStorage.setItem("history", JSON.stringify(transactions));

      updateUI();

      alert("Deposit Successful!");
    },

    onClose: function(){
      alert("Payment closed");
    }
  });

  handler.openIframe();
}

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.reload();
}

</script>

</body>
